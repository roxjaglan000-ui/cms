<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Block diagram of smart feeder panel"><style>
rect.bg{fill:#f8f9f6}
text{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;fill:#1d2321}
.t-small{font-size:10.5px;fill:#5b6461}
.t-head{font-family:"Arial Narrow",Arial,sans-serif;font-size:15px;font-weight:600;fill:#1d2321}
.box{fill:#eceeea;stroke:#1d2321;stroke-width:1.4}
.box-acc{fill:#eceeea;stroke:#2f5d50;stroke-width:2}
.w{fill:none;stroke:#1d2321;stroke-width:2}
.w-thin{fill:none;stroke:#1d2321;stroke-width:1.4}
.sig{fill:none;stroke:#2f5d50;stroke-width:1.6;stroke-dasharray:5 4}
.r{stroke:#c62828}.y{stroke:#b88a00}.b{stroke:#1f5fbf}.n{stroke:#1d2321}.pe{stroke:#2e7d32}
.dot{fill:#1d2321}
</style><rect class="bg" width="960" height="350"/>
    <!-- power row -->
    <g>
      <rect class="box" x="10" y="40" width="115" height="58" rx="4"/><text x="67" y="64" text-anchor="middle" class="t-head">3Φ Supply</text><text x="67" y="84" text-anchor="middle" class="t-small">415 V + N</text>
      <rect class="box" x="150" y="40" width="120" height="58" rx="4"/><text x="210" y="64" text-anchor="middle" class="t-head">Incomer</text><text x="210" y="84" text-anchor="middle" class="t-small">4P MCB 40A + SPD</text>
      <rect class="box" x="290" y="40" width="120" height="58" rx="4"/><text x="350" y="64" text-anchor="middle" class="t-head">Energy Meter</text><text x="350" y="84" text-anchor="middle" class="t-small">3Φ · RS485 Modbus</text>
      <rect class="box" x="430" y="40" width="120" height="58" rx="4"/><text x="490" y="64" text-anchor="middle" class="t-head">Al Busbar</text><text x="490" y="84" text-anchor="middle" class="t-small">R · Y · B · N</text>
      <rect class="box" x="570" y="40" width="120" height="58" rx="4"/><text x="630" y="64" text-anchor="middle" class="t-head">Contactor K1</text><text x="630" y="84" text-anchor="middle" class="t-small">4P 40A AC-1</text>
      <rect class="box" x="710" y="40" width="110" height="58" rx="4"/><text x="765" y="64" text-anchor="middle" class="t-head">Outgoing</text><text x="765" y="84" text-anchor="middle" class="t-small">2 feeder · 6 MCB · RCCB</text>
      <rect class="box" x="840" y="40" width="110" height="58" rx="4"/><text x="895" y="64" text-anchor="middle" class="t-head">Street Lights</text><text x="895" y="84" text-anchor="middle" class="t-small">R/Y/B feeders</text>
      <path class="w" d="M125 69H150M270 69H290M410 69H430M550 69H570M690 69H710M820 69H840" style="stroke-width:4px"/>
    </g>
    <!-- controller row -->
    <rect class="box-acc" x="430" y="196" width="210" height="64" rx="4"/>
    <text x="535" y="222" text-anchor="middle" class="t-head">Controller</text>
    <text x="535" y="242" text-anchor="middle" class="t-small">ESP32 + 4G (LilyGO T-A7670)</text>
    <rect class="box" x="150" y="216" width="150" height="56" rx="4"/>
    <text x="225" y="238" text-anchor="middle" class="t-head">Inputs</text>
    <text x="225" y="257" text-anchor="middle" class="t-small">Door · Aux · Selector</text>
    <rect class="box" x="470" y="296" width="130" height="40" rx="4"/>
    <text x="535" y="321" text-anchor="middle" class="t-small">RTC DS3231 · 18650</text>
    <rect class="box" x="690" y="200" width="120" height="56" rx="4"/>
    <text x="750" y="224" text-anchor="middle" class="t-head">4G Network</text>
    <text x="750" y="243" text-anchor="middle" class="t-small">Jio / Airtel SIM</text>
    <rect class="box-acc" x="840" y="200" width="110" height="56" rx="4"/>
    <text x="895" y="224" text-anchor="middle" class="t-head">CMS Server</text>
    <text x="895" y="243" text-anchor="middle" class="t-small">ThingsBoard</text>
    <rect class="box" x="840" y="290" width="110" height="46" rx="4"/>
    <text x="895" y="318" text-anchor="middle" class="t-small">PC / Mobile</text>
    <!-- signals -->
    <path class="sig" d="M350 98V212H430"/><text x="358" y="160" class="t-small">RS485 (V, I, kW, kWh)</text>
    <path class="sig" d="M610 196V98"/><text x="616" y="150" class="t-small">Relay → coil</text>
    <path class="sig" d="M790 98V170H620V196"/><text x="700" y="164" class="t-small">MCB trip sense</text>
    <path class="sig" d="M300 244H430"/>
    <path class="sig" d="M535 260V296"/><text x="542" y="282" class="t-small">I2C</text>
    <path class="sig" d="M640 228H690"/><text x="645" y="218" class="t-small">4G</text>
    <path class="sig" d="M810 228H840"/>
    
    <path class="sig" d="M895 256V290"/>
  </svg>