# Ek server pe poora CMS: docker compose up -d
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: cms
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms"]
      interval: 5s
      retries: 20

  cms:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://cms:${DB_PASSWORD}@db:5432/cms
    ports:
      - "8080:8080"   # dashboard (aage Nginx/Caddy se HTTPS lagao)
      - "1883:1883"   # panels ka MQTT

volumes:
  dbdata:
